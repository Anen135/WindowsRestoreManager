# Example showing removal and Windows feature changes.
# Review before execution.

[Settings]
ConfirmBeforeExecute = true
AutoInstallChocolatey = true
DefaultScope = Auto
RestartExplorerAfterSettings = true

[Apps.Uninstall]
# opera
# teams
# onedrive

[System.Disable]
# Telnet
# HyperV

[System.Settings]
ShowFileExtensions = true
ShowHiddenFiles = true

[System.Enable]
SSHClient

[Apps.Install]
# firefox
# tor-browser

[Apps.Upgrade]
