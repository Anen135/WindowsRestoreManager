# Windows Restore Manager 2 profile
# ---------------------------------
# The profile is declarative: it describes what to remove, what Windows
# components/settings to change, what to install, and what to upgrade.
#
# Run from GUI: Load profile -> Run profile
# Or start the manager with:
#   .\RestoreManager.ps1 -Config .\install.conf
#
# Application entries normally use the stable "key" from catalog.json.
#
# Optional source override syntax:
#   vscode = winget
#   vscode = choco
#   custom-tool = winget|Publisher.PackageId
#   custom-tool = choco|package-name
#   custom-portable = portable|https://drive.google.com/file/d/FILE_ID/view
#   construct3 = manual|https://editor.construct.net/
#
# Legacy portable syntax is also accepted:
#   custom-portable = https://drive.google.com/file/d/FILE_ID/view

[Settings]
ConfirmBeforeExecute = true
AutoInstallChocolatey = true
DefaultScope = Auto
RestartExplorerAfterSettings = true

# ---------------------------------------------------------------------------
# Remove applications before restoring the desired set.
# Uncomment/add entries as required.
# ---------------------------------------------------------------------------
[Apps.Uninstall]
# onedrive
# teams
# opera
# qbittorrent

# ---------------------------------------------------------------------------
# Disable Windows optional features/capabilities.
# ---------------------------------------------------------------------------
[System.Disable]
# Telnet
# HyperV

# ---------------------------------------------------------------------------
# Named Windows settings. Only supported allow-listed keys are accepted;
# install.conf cannot execute arbitrary PowerShell code.
# ---------------------------------------------------------------------------
[System.Settings]
ShowFileExtensions = true
ShowHiddenFiles = true
ShowProtectedOSFiles = false
DeveloperMode = true
LongPaths = true
DarkMode = true
ClipboardHistory = true
ShowSecondsInClock = false
PowerPlan = Balanced

# ---------------------------------------------------------------------------
# Enable Windows components.
# ---------------------------------------------------------------------------
[System.Enable]
SSHClient
VMP
WSL

# Optional:
# SSHServer
# Telnet
# HyperV

# ---------------------------------------------------------------------------
# Main restore set, based on the original restore-apps.ps1.
# ---------------------------------------------------------------------------
[Apps.Install]
app-installer
powershell
windows-terminal
powertoys
onedrive
memreduct
rainmeter
superfile
ncalayer

git
github-cli
gitflow-next
vscode
visual-studio-community
dotnet-sdk-10
windows-sdk
neovim
ripgrep
node-lts
postgresql18
ffmpeg

discord
ayugram
steam
winrar
obsidian
dropbox
terabox
radmin-vpn
audiorelay
live2d
sketchup-2026
unity-hub
unity-6000
antigravity
claude

python-312
python-313
python-314
qbittorrent
msys2
opera-gx

# Examples from the expanded catalog:
# blender
# construct3
# autocad
# chrome
# firefox
# tor-browser
# libreoffice
# docker-desktop
# bitwarden
