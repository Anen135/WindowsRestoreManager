# obs-studio

# Private portable example:
# my-private-tool = portable|https://drive.google.com/file/d/FILE_ID/view?usp=sharing

# ---------------------------------------------------------------------------
# Upgrade selected applications after the install stage.
# ---------------------------------------------------------------------------
[Apps.Upgrade]
# git
# vscode
# firefox
